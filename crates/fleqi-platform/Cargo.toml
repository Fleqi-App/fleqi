[package]
name = "fleqi-platform"
description = "Fleqi 平台适配：macOS Finder、窗口、快捷键、权限、凭据与系统操作"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fleqi-domain = { workspace = true }
fleqi-application = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
flate2 = "1"
tar = "0.4"

[build-dependencies]
cc = "1.4.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
  "NSAppleEventDescriptor",
  "NSAppleScript",
  "NSArray",
  "NSDictionary",
  "NSNotification",
  "NSOperation",
  "NSObject",
  "NSString",
  "NSURL",
] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSOpenPanel",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSWindow",
  "NSWorkspace",
] }
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Com",
  "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemServices", "Win32_Web_InternetExplorer",
] }
