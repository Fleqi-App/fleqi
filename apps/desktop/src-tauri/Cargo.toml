[package]
name = "fleqi-desktop"
description = "Fleqi Tauri 桌面宿主：窗口、IPC 注册与依赖装配（不承载业务逻辑）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fleqi-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
fleqi-adapters = { workspace = true }
fleqi-application = { workspace = true }
fleqi-domain = { workspace = true }
fleqi-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2"
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }

[features]
default = []
# 原生测试构建：内嵌 W3C WebDriver 服务 + 独立数据目录/凭据命名空间。只有 test:desktop 显式启用；普通包不含。
desktop-test = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
tempfile = "3"
